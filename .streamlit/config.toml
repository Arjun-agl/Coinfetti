# Dark theme that matches theme.py (slate background, green accent).
# theme.py's CSS assumes a dark page; without this, current Streamlit versions
# render a white page and the light heading colours become unreadable.
[theme]
base = "dark"
primaryColor = "#22c55e"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#e2e8f0"
